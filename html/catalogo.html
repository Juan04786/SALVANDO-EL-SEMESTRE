<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Crocheterias Maho</title>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --tierra: #8B5E3C;
      --tierra-claro: #C4895A;
      --rosa: #C2748A;
      --rosa-claro: #D99BAD;
      --fondo: #FDF6F0;
      --texto: #3D2B1F;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Quicksand', sans-serif;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
    }

    header {
      background: var(--tierra);
      color: white;
      padding: 1.5rem 2rem;
      text-align: center;
    }

    header h1 {
      font-family: 'Chewy', cursive;
      font-size: 2.5rem;
      letter-spacing: 2px;
    }

    header p { opacity: 0.85; margin-top: 4px; }

    nav {
      background: var(--tierra-claro);
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      padding: 0.75rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }

    nav a:hover { text-decoration: underline; }

    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    main h2 {
      font-family: 'Chewy', cursive;
      font-size: 1.8rem;
      color: var(--tierra);
      margin-bottom: 1.5rem;
    }

    #productos-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .producto-card {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 15px rgba(139,94,60,0.1);
      transition: transform 0.2s;
      border-top: 4px solid var(--rosa);
    }

    .producto-card:hover { transform: translateY(-4px); }

    .producto-categoria {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--rosa);
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .producto-nombre {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--texto);
      margin-bottom: 8px;
    }

    .producto-precio {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--tierra);
      margin-bottom: 1rem;
    }

    .btn-agregar {
      width: 100%;
      padding: 10px;
      background: var(--tierra);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-agregar:hover { background: var(--tierra-claro); }

    .cargando {
      grid-column: 1/-1;
      text-align: center;
      padding: 3rem;
      font-size: 1.2rem;
      color: var(--tierra);
    }

    .error-msg {
      grid-column: 1/-1;
      text-align: center;
      padding: 2rem;
      background: #fff0f0;
      border-radius: 12px;
      color: #c0392b;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1>🧶 Crocheterias Maho</h1>
    <p>Tejido con amor desde 2020</p>
  </header>

  <nav>
    <a href="../index.html">Inicio</a>
    <a href="catalogo.html">Catálogo</a>
    <a href="nosotros.html">Nosotros</a>
    <a href="registro.html">Registro</a>
  </nav>

  <main>
    <h2>🛍️ Nuestros Productos</h2>
    <div id="productos-container">
      <!-- Los productos se cargan aquí con fetch() -->
    </div>
  </main>

  <script src="../js/api.js"></script>
</body>
</html>
